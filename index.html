<script>
/* Home: the instrument cycle (Fathom Brand 3.0, Home exception, 2026-10-29).
   Sweep: one turn every 14 s (one turn the first time, then three), readout BRG 000-359.
   Silence 2.2 s. Sounding 7 s: a marine line drops to the footer rule and rises; DPT fades in when it reaches depth.
   Silence 2.2 s, then again. Under reduced motion the mark holds still and the readout shows BRG 000°. */
(function () {
  var mark = document.getElementById('mark'), foot = document.getElementById('foot');
  var dial = document.getElementById('dial'), pulse = document.getElementById('pulse');
  var clock = document.getElementById('clock'), readout = document.getElementById('readout'), readval = document.getElementById('readval');
  function p2(n) { return n < 10 ? '0' + n : '' + n; }
  function utc() { var d = new Date(); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + 'Z'; }
  function tick() { clock.textContent = utc(); }
  tick(); setInterval(tick, 1000);
  function show(text, on) { if (text !== null) readval.textContent = text; readout.style.opacity = on ? '1' : '0'; }
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { show('BRG 000°', true); return; }
  var travel = 140;
  function measure() {
    var a = mark.getBoundingClientRect(), b = foot.getBoundingClientRect();
    var t = Math.round(b.top - (a.top + a.height * 0.88)); travel = t > 0 ? t : 0;
  }
  window.addEventListener('resize', measure); setTimeout(measure, 300);
  function ease(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  function pulseAt(p) {
    var k;
    if (p < 0.08) { k = ease(p / 0.08); return [0, 1, 0.7 * k]; }
    if (p < 0.5) { k = ease((p - 0.08) / 0.42); return [travel * k, 1 + 0.3 * k, 0.7 - 0.2 * k]; }
    if (p < 0.92) { k = ease((p - 0.5) / 0.42); return [travel * (1 - k), 1.3 + 0.65 * k, 0.5 - 0.36 * k]; }
    k = (p - 0.92) / 0.08; return [0, 1.95 + 0.05 * k, 0.14 * (1 - k)];
  }
  var phase = 'silent', start = 0, lastBrg = 0, depthShown = false, cycle = 0;
  function setPulse(y, x, o) { pulse.style.transform = 'translateY(' + y.toFixed(1) + 'px) scaleX(' + x.toFixed(3) + ')'; pulse.style.opacity = o.toFixed(3); }
  function enter(ph) {
    phase = ph; start = Date.now(); lastBrg = 0; depthShown = false;
    dial.style.transform = 'rotate(0deg)'; setPulse(0, 1, 0);
    if (ph === 'sweep') show('BRG 000°', true); else show(null, false);
  }
  function frame() {
    var now = Date.now();
    if (phase === 'sweep') {
      var ang = ((now - start) / 14000) * 360 % 360;
      dial.style.transform = 'rotate(' + ang.toFixed(2) + 'deg)';
      if (now - lastBrg >= 200) { lastBrg = now; readval.textContent = 'BRG ' + ('00' + (Math.floor(ang) % 360)).slice(-3) + '°'; }
    } else if (phase === 'sound') {
      var p = Math.min((now - start) / 6000, 1), v = pulseAt(p);
      setPulse(v[0], v[1], v[2]);
      if (p >= 0.5 && !depthShown) { depthShown = true; show('DPT 142M', true); }
    }
    requestAnimationFrame(frame);
  }
  function runCycle() {
    var sweep = cycle === 0 ? 14000 : 42000; cycle++;
    enter('sweep');
    setTimeout(function () {
      enter('silent');
      setTimeout(function () {
        measure(); enter('sound');
        setTimeout(function () { enter('silent'); setTimeout(runCycle, 2200); }, 7000);
      }, 2200);
    }, sweep);
  }
  requestAnimationFrame(frame);
  setTimeout(runCycle, 2000);
})();
</script>
